spring.application.name=academic-scheduler

spring.datasource.url=jdbc:postgresql://localhost:5432/scheduler
spring.datasource.username=scheduler
spring.datasource.password=scheduler

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

scheduler.admin.correo=${SCHEDULER_ADMIN_CORREO:}
scheduler.admin.contrasenia=${SCHEDULER_ADMIN_CONTRASENIA:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
