spring.application.name=academic-scheduler

spring.datasource.url=${SCHEDULER_DB_URL:jdbc:mysql://localhost:${SCHEDULER_DB_PUERTO:3306}/scheduler}
spring.datasource.username=${SCHEDULER_DB_USUARIO:scheduler}
spring.datasource.password=${SCHEDULER_DB_CONTRASENIA:scheduler}
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed

scheduler.admin.correo=${SCHEDULER_ADMIN_CORREO:}
scheduler.admin.contrasenia=${SCHEDULER_ADMIN_CONTRASENIA:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
