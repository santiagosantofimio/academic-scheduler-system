<main class="login-page container-fluid">
  <section class="login-story" aria-labelledby="welcome-title">
    <img class="brand-logo brand-logo--login" src="images/logos/sis-gen.png" alt="SIS GEN" />
    <div class="story-copy">
      <p class="story-program">Ingeniería de Sistemas</p>
      <h1 id="welcome-title">Gestión de horarios académicos</h1>
      <p class="story-description">
        Crea tu cuenta de administrador para gestionar docentes, grupos y horarios.
      </p>
    </div>
  </section>
  <section class="login-access" aria-labelledby="registro-title">
    <div class="login-form-wrap login-form-wrap--registro">
      <h2 id="registro-title">Crear cuenta de administrador</h2>
      <p class="muted login-intro">Usa tu correo institucional @unbosque.edu.co.</p>
      <app-feedback [message]="error" kind="error"></app-feedback>
      <form [formGroup]="form" (ngSubmit)="registrar()" novalidate>
        <div class="registro-grid">
          <div class="field">
            <label for="nombre">Nombre</label>
            <input id="nombre" formControlName="nombre" autocomplete="given-name" />
            <app-field-error [control]="form.controls.nombre"></app-field-error>
          </div>
          <div class="field">
            <label for="apellido">Apellido</label>
            <input id="apellido" formControlName="apellido" autocomplete="family-name" />
            <app-field-error [control]="form.controls.apellido"></app-field-error>
          </div>
          <div class="field">
            <label for="documento">Número de documento</label>
            <input id="documento" formControlName="numeroDocumento" inputmode="numeric" />
            <app-field-error [control]="form.controls.numeroDocumento"></app-field-error>
          </div>
          <div class="field">
            <label for="cargo">Cargo</label>
            <input id="cargo" formControlName="cargo" placeholder="Ej: Administrador" />
            <app-field-error [control]="form.controls.cargo"></app-field-error>
          </div>
        </div>
        <div class="field">
          <label for="correo">Correo institucional</label>
          <input
            id="correo"
            type="email"
            formControlName="correo"
            autocomplete="username"
            placeholder="nombre@unbosque.edu.co"
          />
          <app-field-error [control]="form.controls.correo"></app-field-error>
        </div>
        <div class="registro-grid">
          <div class="field">
            <label for="password">Contraseña</label>
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              autocomplete="new-password"
              placeholder="Mínimo 8 caracteres"
            />
            <app-field-error [control]="form.controls.password"></app-field-error>
          </div>
          <div class="field">
            <label for="confirmacion">Confirmar contraseña</label>
            <input
              id="confirmacion"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="confirmacion"
              autocomplete="new-password"
            />
            <app-field-error [control]="form.controls.confirmacion"></app-field-error>
            <p
              class="field-error"
              *ngIf="form.errors?.['distintas'] && form.controls.confirmacion.touched"
            >
              Las contraseñas no coinciden.
            </p>
          </div>
        </div>
        <label class="registro-ver">
          <input type="checkbox" [checked]="showPassword" (change)="showPassword = !showPassword" />
          Mostrar contraseñas
        </label>
        <div class="field" *ngIf="pideCodigo">
          <label for="codigo">Código de registro</label>
          <input id="codigo" formControlName="codigo" autocomplete="off" />
          <app-field-error [control]="form.controls.codigo"></app-field-error>
        </div>
        <button class="button button-primary login-submit" type="submit" [disabled]="busy">
          <span *ngIf="busy" class="spinner"></span>{{ busy ? 'Creando cuenta…' : 'Crear cuenta'
          }}<app-icon *ngIf="!busy" name="arrow"></app-icon>
        </button>
      </form>
      <p class="registro-enlace">
        ¿Ya tienes una cuenta? <a routerLink="/ingresar">Inicia sesión</a>
      </p>
    </div>
  </section>
</main>
