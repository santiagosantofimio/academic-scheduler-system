services:
  mysql:
    image: mysql:8.4
    container_name: scheduler-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: scheduler
      MYSQL_USER: scheduler
      MYSQL_PASSWORD: scheduler
      MYSQL_ROOT_PASSWORD: root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${SCHEDULER_DB_PUERTO:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u scheduler -pscheduler --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: scheduler-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: scheduler-backend
    restart: unless-stopped
    profiles: ["completo"]
    environment:
      SCHEDULER_DB_URL: jdbc:mysql://mysql:3306/scheduler
      SCHEDULER_DB_USUARIO: scheduler
      SCHEDULER_DB_CONTRASENIA: scheduler
      SCHEDULER_ADMIN_CORREO: ${SCHEDULER_ADMIN_CORREO:-}
      SCHEDULER_ADMIN_CONTRASENIA: ${SCHEDULER_ADMIN_CONTRASENIA:-}
      SCHEDULER_REGISTRO_CODIGO: ${SCHEDULER_REGISTRO_CODIGO:-}
      TZ: America/Bogota
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  frontend:
    build: ./frontend
    container_name: scheduler-frontend
    restart: unless-stopped
    profiles: ["completo"]
    ports:
      - "${SCHEDULER_WEB_PUERTO:-8090}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
